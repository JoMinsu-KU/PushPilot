[project]
name = "pushpilot-main-app"
version = "0.1.0"
description = "A reviewable tablet workspace for bounded tabletop missions"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "opencv-contrib-python-headless==5.0.0.93",
    "numpy==2.5.4",
]

[tool.pushpilot]
workspace_status = "temporary_map_workspace"
runtime_implemented = true
physical_execution_implemented = true
physical_execution_enabled_by_default = false
autonomous_physical_release_qualified = false
